<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#081220" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="PULSE VPN — اتصال امن، آزادی بیشتر" />
  <title>PULSE VPN — وی‌پی‌ان پالس</title>

  <link rel="icon" type="image/jpeg" href="assets/images/pulse-logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  <link rel="preconnect" href="https://telegram.org" />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      window.tailwind.config = {
        corePlugins: { preflight: false },
        theme: {
          extend: {
            fontFamily: { sans: ['IRANSansX', 'Vazirmatn', 'Tahoma', 'sans-serif'] }
          }
        }
      };
    }
  </script>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/utilities.css" />
</head>
<body>
  <a href="#screen-root" class="hidden-sr">پرش به محتوای اصلی</a>

  <main id="app" class="pulse-app" role="main">
    <div id="screen-root">
      <div class="pulse-boot" aria-live="polite">
        <div class="pulse-boot__logo">
          <img
            src="assets/images/pulse-logo.jpg"
            alt="PULSE VPN"
            width="160"
            height="160"
            decoding="async"
          />
        </div>
        <h1 class="pulse-boot__title">PULSE VPN</h1>
        <p class="pulse-boot__tagline">اتصال امن، آزادی بیشتر</p>
      </div>
    </div>

    <nav id="bottom-nav" role="navigation" aria-label="ناوبری اصلی"></nav>
  </main>

  <!-- ============================================================
       HOME
       ============================================================ -->
  <template id="tpl-home">
    <div class="pulse-page">
      <header class="pulse-home-header">
        <img
          src="assets/images/pulse-logo.jpg"
          alt="PULSE VPN"
          width="40"
          height="40"
          decoding="async"
          class="pulse-home-header__logo"
        />
        <div class="pulse-home-header__info">
          <div class="pulse-home-header__name">PULSE VPN</div>
          <div class="pulse-home-header__tagline">اتصال امن، آزادی بیشتر</div>
        </div>
        <button type="button" class="pulse-icon-btn" data-action="notifications" aria-label="اعلان‌ها"></button>
        <button type="button" class="pulse-home-header__avatar" data-action="account" aria-label="پروفایل">
          <div class="pulse-avatar pulse-avatar--md" data-bind="avatarInitial">پ</div>
        </button>
      </header>

      <div class="pulse-card pulse-wallet-card">
        <div class="pulse-wallet-card__icon" data-icon="wallet"></div>
        <div class="pulse-wallet-card__body">
          <div class="pulse-wallet-card__label">موجودی کیف پول</div>
          <div class="pulse-wallet-card__balance pulse-num" data-bind="walletBalance">0 تومان</div>
        </div>
        <button type="button" class="pulse-btn pulse-btn--accent pulse-btn--sm" data-action="wallet">شارژ</button>
      </div>

      <section class="pulse-page-section" data-slot="subscription"></section>

      <div class="pulse-page-section">
        <button type="button" class="pulse-btn pulse-btn--primary pulse-btn--lg pulse-btn--block" data-action="buy">
          <span data-icon="sparkles" class="shrink-0"></span>
          <span>خرید اشتراک</span>
        </button>
      </div>

      <div class="pulse-quick-actions" data-slot="quickActions"></div>
    </div>
  </template>

  <template id="tpl-home-sub-empty">
    <div class="pulse-card">
      <div class="pulse-empty">
        <div class="pulse-empty__icon" data-icon="package"></div>
        <div class="pulse-empty__title">هنوز اشتراکی نداری</div>
        <div class="pulse-empty__text">با خرید اولین اشتراک، اتصال امن و پرسرعت را تجربه کن.</div>
        <button type="button" class="pulse-btn pulse-btn--primary" data-action="buy">خرید اولین اشتراک</button>
      </div>
    </div>
  </template>

  <template id="tpl-home-sub-active">
    <div class="pulse-card">
      <div class="pulse-home-sub__header">
        <div class="pulse-home-sub__title">اشتراک فعال</div>
        <span class="pulse-chip pulse-chip--active"><span class="pulse-chip__dot"></span><span>فعال</span></span>
      </div>
      <div class="pulse-home-sub__row">
        <span class="pulse-home-sub__label">مصرف</span>
        <span class="pulse-home-sub__value pulse-num" data-bind="usage">0 از 0 گیگابایت</span>
      </div>
      <div class="pulse-progress"><div class="pulse-progress__fill" data-bind="usageBar"></div></div>
      <div class="pulse-home-sub__row pulse-home-sub__row--spaced">
        <span class="pulse-home-sub__label">زمان باقی‌مانده</span>
        <span class="pulse-home-sub__value pulse-num" data-bind="daysLeft">0 روز</span>
      </div>
    </div>
  </template>

  <template id="tpl-quick-action">
    <button type="button" class="pulse-quick-action">
      <div class="pulse-quick-action__icon" data-icon></div>
      <span data-label></span>
    </button>
  </template>

  <template id="tpl-bottom-nav-item">
    <button type="button" class="pulse-bottom-nav__item">
      <span data-icon></span>
      <span data-label></span>
    </button>
  </template>

  <!-- ============================================================
       DURATION
       ============================================================ -->
  <template id="tpl-duration">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">انتخاب مدت اشتراک</h1>
      </header>
      <div class="pulse-page-section">
        <p class="pulse-duration-intro">مدت اشتراک خود را انتخاب کنید. سپس نوع اتصال و حجم را انتخاب خواهید کرد.</p>
      </div>
      <div class="pulse-page-row" data-slot="durations"></div>
      <div class="pulse-page-section pulse-mt-2">
        <button type="button" class="pulse-btn pulse-btn--primary pulse-btn--lg pulse-btn--block" data-action="continue" disabled>ادامه</button>
      </div>
    </div>
  </template>

  <template id="tpl-duration-card">
    <button type="button" class="pulse-plan-card">
      <div class="pulse-plan-card__radio"></div>
      <div class="pulse-plan-card__body">
        <div class="pulse-plan-card__volume" data-bind="title"></div>
        <div class="pulse-plan-card__meta">پلن‌های این مدت در مرحله بعد نمایش داده می‌شود</div>
      </div>
      <span class="pulse-plan-card__chevron" data-icon="chevronLeft"></span>
    </button>
  </template>

  <!-- ============================================================
       CONNECTION TYPE
       ============================================================ -->
  <template id="tpl-connection-type">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">انتخاب نوع اتصال</h1>
      </header>
      <div class="pulse-page-section">
        <p class="pulse-duration-intro">نوع اتصال خود را انتخاب کنید. تانل پرسرعت‌تر و پایدارتر از عادی است.</p>
      </div>
      <div class="pulse-connection-list" data-slot="options"></div>
      <div class="pulse-page-section pulse-mt-2">
        <button type="button" class="pulse-btn pulse-btn--primary pulse-btn--lg pulse-btn--block" data-action="continue" disabled>ادامه</button>
      </div>
    </div>
  </template>

  <template id="tpl-connection-card">
    <button type="button" class="pulse-connection-card">
      <div class="pulse-connection-card__radio"></div>
      <div class="pulse-connection-card__body">
        <div class="pulse-connection-card__header">
          <span class="pulse-connection-card__title" data-bind="title"></span>
          <span class="pulse-connection-card__badge" data-bind="badge" hidden>پرسرعت</span>
        </div>
        <div class="pulse-connection-card__description" data-bind="description"></div>
      </div>
    </button>
  </template>

  <!-- ============================================================
       PLANS
       ============================================================ -->
  <template id="tpl-plans">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title" data-bind="pageTitle">پلن‌ها</h1>
      </header>
      <div class="pulse-page-section">
        <p class="pulse-duration-intro">یکی از پلن‌های زیر را انتخاب کنید.</p>
      </div>
      <div class="pulse-page-row" data-slot="plans"></div>
      <div class="pulse-page-section pulse-mt-2">
        <button type="button" class="pulse-btn pulse-btn--primary pulse-btn--lg pulse-btn--block" data-action="continue" disabled>ادامه</button>
      </div>
    </div>
  </template>

  <template id="tpl-plan-card">
    <button type="button" class="pulse-plan-card">
      <span class="pulse-chip pulse-chip--popular pulse-plan-card__popular" data-bind="badge" hidden>محبوب</span>
      <div class="pulse-plan-card__radio"></div>
      <div class="pulse-plan-card__body">
        <div class="pulse-plan-card__volume" data-bind="volume"></div>
        <div class="pulse-plan-card__meta" data-bind="meta"></div>
      </div>
      <div class="pulse-plan-card__price pulse-num" data-bind="price"></div>
    </button>
  </template>

  <!-- ============================================================
       CHECKOUT
       ============================================================ -->
  <template id="tpl-checkout">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">بررسی و پرداخت</h1>
      </header>

      <div class="pulse-page-section">
        <p class="pulse-duration-intro">قبل از پرداخت، خلاصه سفارش و روش پرداخت را بررسی کنید.</p>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-card">
          <div class="pulse-checkout-row">
            <span class="pulse-checkout-row__label">نوع اتصال</span>
            <span class="pulse-checkout-row__value" data-bind="type"></span>
          </div>
          <div class="pulse-checkout-row">
            <span class="pulse-checkout-row__label">مدت</span>
            <span class="pulse-checkout-row__value" data-bind="duration"></span>
          </div>
          <div class="pulse-checkout-row">
            <span class="pulse-checkout-row__label">حجم</span>
            <span class="pulse-checkout-row__value" data-bind="volume"></span>
          </div>
        </div>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-price-box">
          <div class="pulse-price-box__row">
            <span class="pulse-price-box__label">قیمت نهایی</span>
            <span class="pulse-price-box__value pulse-num" data-bind="total"></span>
          </div>
          <div class="pulse-price-box__row">
            <span class="pulse-price-box__label">موجودی کیف پول</span>
            <span class="pulse-price-box__value pulse-num" data-bind="balance"></span>
          </div>
          <div class="pulse-price-box__row">
            <span class="pulse-price-box__label" data-bind="remainingLabel">مبلغ قابل پرداخت</span>
            <span class="pulse-price-box__value pulse-num" data-bind="remaining"></span>
          </div>
        </div>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-section-label">روش پرداخت</div>
        <div class="pulse-method-list">
          <button type="button" class="pulse-method" data-method="wallet" aria-label="پرداخت از کیف پول">
            <span class="pulse-method__icon" data-icon="wallet"></span>
            <div class="pulse-method__body">
              <div class="pulse-method__title">کیف پول PULSE VPN</div>
              <div class="pulse-method__text">پرداخت از موجودی کیف پول</div>
            </div>
            <span class="pulse-method__radio"></span>
          </button>

          <button type="button" class="pulse-method is-active" data-method="card_to_card" aria-label="کارت به کارت">
            <span class="pulse-method__icon" data-icon="creditCard"></span>
            <div class="pulse-method__body">
              <div class="pulse-method__title">کارت به کارت</div>
              <div class="pulse-method__text">انتقال به یکی از کارت‌های زیر و ارسال رسید</div>
            </div>
            <span class="pulse-method__radio"></span>
          </button>
        </div>
      </div>

      <div class="pulse-page-section" data-slot="cards-section">
        <div class="pulse-section-label">شماره کارت‌های مقصد</div>
        <div class="pulse-cards-list" data-slot="cards"></div>
      </div>

      <div class="pulse-page-section pulse-mt-2">
        <button type="button" class="pulse-btn pulse-btn--primary pulse-btn--lg pulse-btn--block" data-action="pay">
          <span data-icon="shield" class="shrink-0"></span>
          <span data-bind="payLabel">ادامه و ارسال رسید</span>
        </button>
      </div>
    </div>
  </template>

  <template id="tpl-card-account">
    <div class="pulse-card-account">
      <div class="pulse-card-account__top">
        <div class="pulse-card-account__holder" data-bind="holder"></div>
        <div class="pulse-card-account__badge">کارت مقصد</div>
      </div>
      <div class="pulse-card-account__number pulse-num" data-bind="number"></div>
      <button type="button" class="pulse-card-account__copy" data-action="copy-card" aria-label="کپی شماره کارت">
        <span data-icon></span>
        <span>کپی شماره کارت</span>
      </button>
    </div>
  </template>

  <!-- ============================================================
       RECEIPT UPLOAD
       ============================================================ -->
  <template id="tpl-receipt-upload">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">ارسال رسید پرداخت</h1>
      </header>

      <div class="pulse-page-section">
        <p class="pulse-duration-intro">پس از واریز مبلغ به یکی از کارت‌های اعلام‌شده، تصویر رسید را ارسال کنید.</p>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-price-box">
          <div class="pulse-price-box__row">
            <span class="pulse-price-box__label">مبلغ قابل واریز</span>
            <span class="pulse-price-box__value pulse-num" data-bind="amount"></span>
          </div>
        </div>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-section-label">تصویر رسید</div>
        <div class="pulse-receipt">
          <div class="pulse-receipt__placeholder" data-slot="placeholder">
            <span class="pulse-receipt__icon" data-icon="download"></span>
            <div class="pulse-receipt__title">تصویر رسید را انتخاب کنید</div>
            <div class="pulse-receipt__hint">فرمت JPG یا PNG — حداکثر ۵ مگابایت</div>
            <button type="button" class="pulse-btn pulse-btn--secondary" data-action="pick">انتخاب تصویر</button>
          </div>
          <div class="pulse-receipt__preview" data-slot="preview"></div>
        </div>
        <input type="file" accept="image/jpeg,image/jpg,image/png,image/webp" data-role="file-input" class="pulse-file-input" aria-hidden="true" />
      </div>

      <div class="pulse-page-section pulse-mt-2">
        <button type="button" class="pulse-btn pulse-btn--primary pulse-btn--lg pulse-btn--block" data-action="submit" disabled>ارسال رسید برای بررسی</button>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-info-box">
          <span class="pulse-info-box__icon" data-icon="info"></span>
          <div class="pulse-info-box__text">
            رسید شما پس از بررسی توسط تیم پشتیبانی تایید می‌شود. زمان تقریبی بررسی: چند دقیقه تا چند ساعت.
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ============================================================
       PAYMENT RESULT
       ============================================================ -->
  <template id="tpl-payment-result">
    <div class="pulse-page">
      <div class="pulse-page-section">
        <div class="pulse-result pulse-result--pending" data-slot="card">
          <div class="pulse-result__icon" data-slot="icon"><span data-icon="clock"></span></div>
          <div class="pulse-result__title" data-bind="title"></div>
          <div class="pulse-result__text" data-bind="text"></div>
          <div class="pulse-result__detail" data-slot="detail"></div>
        </div>
      </div>
      <div class="pulse-page-section pulse-mt-2" data-slot="actions"></div>
    </div>
  </template>

  <!-- ============================================================
       MY SUBSCRIPTION
       ============================================================ -->
  <template id="tpl-my-subscription">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">اشتراک من</h1>
      </header>
      <div data-slot="content"></div>
    </div>
  </template>

  <template id="tpl-my-sub-empty">
    <div class="pulse-page-section">
      <div class="pulse-card">
        <div class="pulse-empty">
          <div class="pulse-empty__icon" data-icon="shield"></div>
          <div class="pulse-empty__title">اشتراک فعالی نداری</div>
          <div class="pulse-empty__text">برای استفاده از سرویس، یکی از پلن‌های موجود را خریداری کن.</div>
          <button type="button" class="pulse-btn pulse-btn--primary" data-action="buy">خرید اشتراک</button>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-my-sub-active">
    <div class="pulse-page-section">
      <div class="pulse-card">
        <div class="pulse-home-sub__header">
          <div class="pulse-home-sub__title">اشتراک فعال</div>
          <span class="pulse-chip pulse-chip--active"><span class="pulse-chip__dot"></span><span>فعال</span></span>
        </div>

        <div class="pulse-sub-detail-row">
          <span class="pulse-sub-detail-row__label">نوع اتصال</span>
          <span class="pulse-sub-detail-row__value" data-bind="connectionType"></span>
        </div>
        <div class="pulse-sub-detail-row">
          <span class="pulse-sub-detail-row__label">مدت</span>
          <span class="pulse-sub-detail-row__value" data-bind="duration"></span>
        </div>
        <div class="pulse-sub-detail-row" data-row="volumeRow">
          <span class="pulse-sub-detail-row__label">حجم کل</span>
          <span class="pulse-sub-detail-row__value pulse-num" data-bind="volume"></span>
        </div>
        <div class="pulse-sub-detail-row" data-row="usageRow">
          <span class="pulse-sub-detail-row__label">مصرف‌شده</span>
          <span class="pulse-sub-detail-row__value pulse-num" data-bind="usage"></span>
        </div>
        <div data-row="progressRow">
          <div class="pulse-progress"><div class="pulse-progress__fill" data-bind="usageBar"></div></div>
        </div>
        <div class="pulse-sub-detail-row">
          <span class="pulse-sub-detail-row__label">تاریخ انقضا</span>
          <span class="pulse-sub-detail-row__value pulse-num" data-bind="expiresAt"></span>
        </div>
        <div class="pulse-sub-detail-row">
          <span class="pulse-sub-detail-row__label">زمان باقی‌مانده</span>
          <span class="pulse-sub-detail-row__value pulse-num" data-bind="daysLeft"></span>
        </div>
      </div>
    </div>

    <div class="pulse-page-section">
      <div class="pulse-section-label">لینک اشتراک</div>
      <div class="pulse-config-box">
        <div class="pulse-config-box__value pulse-num" data-bind="configLink"></div>
        <div class="pulse-config-box__actions">
          <button type="button" class="pulse-btn pulse-btn--secondary pulse-btn--sm" data-action="copy-config">
            <span data-icon="copy" class="shrink-0"></span>
            <span>کپی</span>
          </button>
          <button type="button" class="pulse-btn pulse-btn--primary pulse-btn--sm" data-action="redownload">
            <span data-icon="download" class="shrink-0"></span>
            <span>دریافت مجدد</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============================================================
       MY PURCHASES
       ============================================================ -->
  <template id="tpl-my-purchases">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">خریدهای من</h1>
      </header>
      <div data-slot="content"></div>
    </div>
  </template>

  <template id="tpl-purchases-empty">
    <div class="pulse-page-section">
      <div class="pulse-card">
        <div class="pulse-empty">
          <div class="pulse-empty__icon" data-icon="package"></div>
          <div class="pulse-empty__title">هنوز خریدی ثبت نشده</div>
          <div class="pulse-empty__text">پس از خرید اولین اشتراک، سفارش‌های شما اینجا نمایش داده می‌شود.</div>
          <button type="button" class="pulse-btn pulse-btn--primary" data-action="buy">خرید اشتراک</button>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-purchases-list">
    <div class="pulse-page-row" data-slot="orders"></div>
  </template>

  <template id="tpl-order-card">
    <button type="button" class="pulse-order-card">
      <div class="pulse-order-card__top">
        <div class="pulse-order-card__id pulse-num" data-bind="orderId"></div>
        <span class="pulse-chip" data-bind="statusChip"></span>
      </div>
      <div class="pulse-order-card__body">
        <div class="pulse-order-card__volume" data-bind="volume"></div>
        <div class="pulse-order-card__meta" data-bind="meta"></div>
      </div>
      <div class="pulse-order-card__bottom">
        <div class="pulse-order-card__date" data-bind="date"></div>
        <div class="pulse-order-card__price pulse-num" data-bind="price"></div>
      </div>
    </button>
  </template>

  <!-- ============================================================
       ORDER DETAIL
       ============================================================ -->
  <template id="tpl-order-detail">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">جزئیات سفارش</h1>
      </header>
      <div data-slot="content"></div>
    </div>
  </template>

  <template id="tpl-order-detail-body">
    <div class="pulse-page-section">
      <div class="pulse-card">
        <div class="pulse-order-detail__header">
          <div>
            <div class="pulse-order-detail__id pulse-num" data-bind="orderId"></div>
            <div class="pulse-order-detail__date" data-bind="date"></div>
          </div>
          <span class="pulse-chip" data-bind="statusChip"></span>
        </div>
      </div>
    </div>

    <div class="pulse-page-section">
      <div class="pulse-section-label">مشخصات اشتراک</div>
      <div class="pulse-card">
        <div class="pulse-sub-detail-row">
          <span class="pulse-sub-detail-row__label">نوع اتصال</span>
          <span class="pulse-sub-detail-row__value" data-bind="connectionType"></span>
        </div>
        <div class="pulse-sub-detail-row">
          <span class="pulse-sub-detail-row__label">مدت</span>
          <span class="pulse-sub-detail-row__value" data-bind="duration"></span>
        </div>
        <div class="pulse-sub-detail-row">
          <span class="pulse-sub-detail-row__label">حجم</span>
          <span class="pulse-sub-detail-row__value pulse-num" data-bind="volume"></span>
        </div>
      </div>
    </div>

    <div class="pulse-page-section">
      <div class="pulse-section-label">اطلاعات پرداخت</div>
      <div class="pulse-card">
        <div class="pulse-sub-detail-row">
          <span class="pulse-sub-detail-row__label">مبلغ</span>
          <span class="pulse-sub-detail-row__value pulse-num" data-bind="price"></span>
        </div>
        <div class="pulse-sub-detail-row" data-row="methodRow">
          <span class="pulse-sub-detail-row__label">روش پرداخت</span>
          <span class="pulse-sub-detail-row__value" data-bind="paymentMethod"></span>
        </div>
      </div>
    </div>

    <div class="pulse-page-section" data-row="configSection">
      <div class="pulse-section-label">لینک اشتراک</div>
      <div class="pulse-config-box">
        <div class="pulse-config-box__value pulse-num" data-bind="configLink"></div>
        <div class="pulse-config-box__actions">
          <button type="button" class="pulse-btn pulse-btn--secondary pulse-btn--sm" data-action="copy-config">
            <span data-icon="copy" class="shrink-0"></span>
            <span>کپی لینک</span>
          </button>
        </div>
      </div>
    </div>

    <div class="pulse-page-section" data-row="adminNoteSection" hidden>
      <div class="pulse-info-box pulse-info-box--warning">
        <span class="pulse-info-box__icon" data-icon="alertCircle"></span>
        <div class="pulse-info-box__text" data-bind="adminNote"></div>
      </div>
    </div>
  </template>

  <template id="tpl-order-detail-notfound">
    <div class="pulse-page-section">
      <div class="pulse-card">
        <div class="pulse-empty">
          <div class="pulse-empty__icon" data-icon="alertCircle"></div>
          <div class="pulse-empty__title">سفارش یافت نشد</div>
          <div class="pulse-empty__text">اطلاعات این سفارش در دسترس نیست.</div>
          <button type="button" class="pulse-btn pulse-btn--secondary" data-action="back">بازگشت</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============================================================
       WALLET
       ============================================================ -->
  <template id="tpl-wallet">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">کیف پول</h1>
      </header>

      <div class="pulse-page-section">
        <div class="pulse-wallet-hero">
          <div class="pulse-wallet-hero__label">موجودی فعلی</div>
          <div class="pulse-wallet-hero__balance pulse-num" data-bind="balance">0 تومان</div>
          <button type="button" class="pulse-btn pulse-btn--accent pulse-btn--block" data-action="charge">
            <span data-icon="plus" class="shrink-0"></span>
            <span>افزایش موجودی</span>
          </button>
        </div>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-section-label">تاریخچه تراکنش‌ها</div>
      </div>

      <div data-slot="content"></div>
    </div>
  </template>

  <template id="tpl-wallet-empty">
    <div class="pulse-page-section">
      <div class="pulse-card">
        <div class="pulse-empty">
          <div class="pulse-empty__icon" data-icon="creditCard"></div>
          <div class="pulse-empty__title">هنوز تراکنشی نداری</div>
          <div class="pulse-empty__text">پس از اولین شارژ یا خرید، تراکنش‌های شما اینجا نمایش داده می‌شود.</div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-wallet-tx-list">
    <div class="pulse-page-row" data-slot="transactions"></div>
  </template>

  <template id="tpl-wallet-tx-item">
    <div class="pulse-tx-item">
      <div class="pulse-tx-item__icon" data-icon></div>
      <div class="pulse-tx-item__body">
        <div class="pulse-tx-item__title" data-bind="title"></div>
        <div class="pulse-tx-item__date" data-bind="date"></div>
      </div>
      <div class="pulse-tx-item__amount pulse-num" data-bind="amount"></div>
    </div>
  </template>

  <!-- ============================================================
       ACCOUNT
       ============================================================ -->
  <template id="tpl-account">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">حساب کاربری</h1>
      </header>

      <div class="pulse-page-section">
        <div class="pulse-profile">
          <div class="pulse-profile__avatar pulse-avatar pulse-avatar--lg" data-bind="avatarInitial">پ</div>
          <div class="pulse-profile__name" data-bind="displayName">کاربر PULSE</div>
          <div class="pulse-profile__username pulse-num" data-bind="username"></div>
        </div>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-card">
          <div class="pulse-sub-detail-row">
            <span class="pulse-sub-detail-row__label">موجودی کیف پول</span>
            <span class="pulse-sub-detail-row__value pulse-num" data-bind="balance"></span>
          </div>
          <div class="pulse-sub-detail-row">
            <span class="pulse-sub-detail-row__label">اشتراک فعلی</span>
            <span class="pulse-sub-detail-row__value" data-bind="subscriptionLabel"></span>
          </div>
          <div class="pulse-sub-detail-row">
            <span class="pulse-sub-detail-row__label">تعداد خریدها</span>
            <span class="pulse-sub-detail-row__value pulse-num" data-bind="ordersCount"></span>
          </div>
        </div>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-menu-list">
          <button type="button" class="pulse-menu-item" data-action="subscription">
            <span class="pulse-menu-item__icon" data-icon="shield"></span>
            <span class="pulse-menu-item__label">اشتراک من</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
          <button type="button" class="pulse-menu-item" data-action="purchases">
            <span class="pulse-menu-item__icon" data-icon="package"></span>
            <span class="pulse-menu-item__label">خریدهای من</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
          <button type="button" class="pulse-menu-item" data-action="wallet">
            <span class="pulse-menu-item__icon" data-icon="wallet"></span>
            <span class="pulse-menu-item__label">کیف پول</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
          <button type="button" class="pulse-menu-item" data-action="guide">
            <span class="pulse-menu-item__icon" data-icon="bookOpen"></span>
            <span class="pulse-menu-item__label">راهنمای خرید</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
          <button type="button" class="pulse-menu-item" data-action="support">
            <span class="pulse-menu-item__icon" data-icon="lifeBuoy"></span>
            <span class="pulse-menu-item__label">پشتیبانی</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============================================================
       SUPPORT
       ============================================================ -->
  <template id="tpl-support">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">پشتیبانی</h1>
      </header>

      <div class="pulse-page-section">
        <p class="pulse-duration-intro">در صورت بروز هر مشکلی، از طریق راه‌های زیر با تیم پشتیبانی در ارتباط باشید.</p>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-menu-list">
          <button type="button" class="pulse-menu-item" data-action="contact">
            <span class="pulse-menu-item__icon" data-icon="lifeBuoy"></span>
            <span class="pulse-menu-item__label">ارتباط با پشتیبانی</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
          <button type="button" class="pulse-menu-item" data-action="payment-issue">
            <span class="pulse-menu-item__icon" data-icon="creditCard"></span>
            <span class="pulse-menu-item__label">مشکل در پرداخت</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
          <button type="button" class="pulse-menu-item" data-action="config-issue">
            <span class="pulse-menu-item__icon" data-icon="shield"></span>
            <span class="pulse-menu-item__label">مشکل در دریافت کانفیگ</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
          <button type="button" class="pulse-menu-item" data-action="connection-issue">
            <span class="pulse-menu-item__icon" data-icon="zap"></span>
            <span class="pulse-menu-item__label">مشکل در اتصال</span>
            <span class="pulse-menu-item__chevron" data-icon="chevronLeft"></span>
          </button>
        </div>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-section-label">سوالات متداول</div>
        <div data-slot="faq"></div>
      </div>
    </div>
  </template>

  <template id="tpl-faq-item">
    <details class="pulse-faq-item">
      <summary class="pulse-faq-item__summary">
        <span class="pulse-faq-item__question" data-bind="question"></span>
        <span class="pulse-faq-item__chevron" data-icon="chevronDown"></span>
      </summary>
      <div class="pulse-faq-item__answer" data-bind="answer"></div>
    </details>
  </template>

  <!-- ============================================================
       GUIDE
       ============================================================ -->
  <template id="tpl-guide">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">راهنمای خرید</h1>
      </header>

      <div class="pulse-page-section">
        <p class="pulse-duration-intro">در چند مرحله ساده، اشتراک خود را خریداری کنید.</p>
      </div>

      <div class="pulse-page-section">
        <div class="pulse-guide-list" data-slot="steps"></div>
      </div>
    </div>
  </template>

  <template id="tpl-guide-step">
    <div class="pulse-guide-step">
      <div class="pulse-guide-step__num" data-bind="num"></div>
      <div class="pulse-guide-step__body">
        <div class="pulse-guide-step__title" data-bind="title"></div>
        <div class="pulse-guide-step__text" data-bind="text"></div>
      </div>
    </div>
  </template>

  <!-- ============================================================
       NOTIFICATIONS
       ============================================================ -->
  <template id="tpl-notifications">
    <div class="pulse-page">
      <header class="pulse-page-header">
        <button type="button" class="pulse-icon-btn" data-action="back" aria-label="بازگشت"></button>
        <h1 class="pulse-page-header__title">اعلان‌ها</h1>
      </header>
      <div data-slot="content"></div>
    </div>
  </template>

  <template id="tpl-notifications-empty">
    <div class="pulse-page-section">
      <div class="pulse-card">
        <div class="pulse-empty">
          <div class="pulse-empty__icon" data-icon="bell"></div>
          <div class="pulse-empty__title">اعلان جدیدی نداری</div>
          <div class="pulse-empty__text">اعلان‌های مربوط به خریدها و اشتراک شما اینجا نمایش داده می‌شود.</div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-notifications-list">
    <div class="pulse-page-row" data-slot="items"></div>
  </template>

  <template id="tpl-notification-item">
    <div class="pulse-notif-item">
      <div class="pulse-notif-item__icon" data-icon></div>
      <div class="pulse-notif-item__body">
        <div class="pulse-notif-item__title" data-bind="title"></div>
        <div class="pulse-notif-item__text" data-bind="text"></div>
        <div class="pulse-notif-item__date" data-bind="date"></div>
      </div>
    </div>
  </template>

  <noscript>
    <div class="pulse-noscript">
      برای استفاده از PULSE VPN، لطفاً جاوااسکریپت مرورگر خود را فعال کنید.
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
